<!-- Source of the Lekours app icon. Open in a browser and screenshot the 512x512 #i element
     (square for logo512/logo192/apple-touch-icon, add class "rounded" for favicon.svg/.ico). -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.icon{width:512px;height:512px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 30% 22%, #A47BFF 0%, #8247F5 45%, #5A22BD 100%);}
.rounded{border-radius:112px}
.sun{position:absolute;left:50%;top:52%;width:330px;height:330px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle, #FFE58A 0%, #FFC21A 70%, #F5A700 100%);
  box-shadow:0 10px 0 rgba(58,26,117,.35)}
.horse{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%) scaleX(-1);font-size:250px;line-height:1;
  font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;filter:drop-shadow(0 6px 0 rgba(58,26,117,.25))}
</style></head><body><div id="i" class="icon"><div class="sun"></div><div class="horse">🏇</div></div></body></html>
